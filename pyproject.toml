[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "A-Maze-ing generator package for the 42 Common Core"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "jabuleje", email = "jabuleje@student.42.fr" },
    { name = "mvasquez", email = "mvasquez@student.42.fr" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
include = ["mazegen*"]